<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المضيف - KSU Visitor Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    
    <style>
        .visit-card {
            background: #fff;
            border-radius: 15px;
            padding: 1.5rem;
            border-right: 5px solid;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s;
            margin-bottom: 1rem;
        }
        .visit-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        .visit-card.pending { border-right-color: #ffc107; }
        .visit-card.approved { border-right-color: #28a745; }
        .visit-card.rejected { border-right-color: #dc3545; }
        .stat-card-host {
            background: #fff;
            border-radius: 15px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }
        .stat-card-host:hover {
            transform: translateY(-3px);
        }
        .stat-card-host .num {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
        }
        .stat-card-host .lbl {
            color: #6c757d;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fas fa-user-tie"></i>
                <span>لوحة المضيف</span>
            </div>
        </div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link active" href="host-dashboard.html">
                <i class="fas fa-clipboard-check"></i>
                <span>الزيارات</span>
            </a>
            <a class="nav-link" href="../visitor.html">
                <i class="fas fa-parking"></i>
                <span>المواقف</span>
            </a>
            <a class="nav-link" href="../index.html">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <hr class="border-secondary mx-3">
            <a class="nav-link text-danger" href="#" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>تسجيل الخروج</span>
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="admin-main">

        <!-- Topbar -->
        <div class="admin-topbar">
            <button class="btn btn-ksu d-lg-none" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0 fw-bold">
                <i class="fas fa-user-tie text-warning me-2"></i>
                لوحة المضيف
                <span class="badge bg-warning text-dark ms-2" id="pendingBadge" style="display:none;">0</span>
            </h4>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted d-none d-md-inline">
                    <i class="fas fa-user-circle me-1"></i>
                    <span id="currentUserName">...</span>
                </span>
                <button class="btn btn-sm btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="admin-content">

            <!-- Welcome -->
            <div class="alert alert-info d-flex align-items-center mb-4" role="alert">
                <i class="fas fa-info-circle fa-2x me-3"></i>
                <div>
                    <h5 class="mb-0">مرحباً بك في لوحة المضيف</h5>
                    <small>راجع طلبات الزيارة ووافق عليها أو ارفضها</small>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stat-card-host">
                        <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                        <div class="num text-warning" id="statPending">0</div>
                        <div class="lbl">قيد الانتظار</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card-host">
                        <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                        <div class="num text-success" id="statApproved">0</div>
                        <div class="lbl">موافق عليها</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card-host">
                        <i class="fas fa-times-circle fa-2x text-danger mb-2"></i>
                        <div class="num text-danger" id="statRejected">0</div>
                        <div class="lbl">مرفوضة</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card-host">
                        <i class="fas fa-list fa-2x text-primary mb-2"></i>
                        <div class="num text-primary" id="statTotal">0</div>
                        <div class="lbl">الإجمالي</div>
                    </div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="admin-card mb-4">
                <ul class="nav nav-pills mb-0">
                    <li class="nav-item">
                        <button class="nav-link active" onclick="filterVisits('Pending', this)">
                            <i class="fas fa-clock me-1"></i> قيد الانتظار
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="filterVisits('Approved', this)">
                            <i class="fas fa-check me-1"></i> الموافق عليها
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="filterVisits('Rejected', this)">
                            <i class="fas fa-times me-1"></i> المرفوضة
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="filterVisits('all', this)">
                            <i class="fas fa-list me-1"></i> الكل
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Visits List -->
            <div id="visitsContainer">
                <div class="text-center py-5">
                    <i class="fas fa-spinner fa-spin fa-3x text-warning"></i>
                    <p class="mt-3 text-muted">جاري تحميل الزيارات...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Approve Modal -->
<div class="modal fade" id="approveModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-check-circle me-2"></i>
                    الموافقة على الزيارة
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>الموافقة على زيارة: <strong id="approveVisitorName">-</strong></p>
                <div class="mb-3">
                    <label class="form-label fw-bold">ملاحظات (اختياري):</label>
                    <textarea class="form-control" id="approveNotes" rows="3" 
                              placeholder="مثل: في انتظارك في المكتب 203..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-success fw-bold" onclick="confirmApprove()">
                    <i class="fas fa-check me-1"></i> تأكيد الموافقة
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Reject Modal -->
<div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fas fa-times-circle me-2"></i>
                    رفض الزيارة
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>رفض زيارة: <strong id="rejectVisitorName">-</strong></p>
                <div class="mb-3">
                    <label class="form-label fw-bold">سبب الرفض *</label>
                    <textarea class="form-control" id="rejectReason" rows="3" 
                              placeholder="مثل: لست متاحاً في هذا الوقت..." required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-danger fw-bold" onclick="confirmReject()">
                    <i class="fas fa-times me-1"></i> تأكيد الرفض
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/host.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // التحقق من تسجيل الدخول
        if (!protectPage(["host", "admin"])) {
            throw new Error("Access denied");
        }

        // عرض اسم المستخدم
        const user = getCurrentUser();
        if (user) {
            document.getElementById("currentUserName").textContent = user.full_name || user.username;
        }

        loadHostVisits();
    });
</script>
</body>
</html>
