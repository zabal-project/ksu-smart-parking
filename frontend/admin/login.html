<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - KSU Smart Parking</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-login-body">

    <!-- Background -->
    <div class="login-bg"></div>
    <div class="login-overlay"></div>

    <!-- Login Container -->
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                
                <div class="login-card" data-aos="zoom-in">
                    
                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <div class="login-logo">
                            <i class="fas fa-parking"></i>
                        </div>
                        <h2 class="fw-bold mt-3 mb-1">KSU Smart Parking</h2>
                        <p class="text-muted">لوحة التحكم الإدارية</p>
                    </div>

                    <!-- Alert -->
                    <div id="loginAlert" class="alert d-none" role="alert"></div>

                    <!-- Form -->
                    <form id="loginForm" autocomplete="off">
                        
                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-user me-1 text-warning"></i>
                                اسم المستخدم
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" 
                                       class="form-control form-control-lg" 
                                       id="username"
                                       placeholder="أدخل اسم المستخدم"
                                       required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-lock me-1 text-warning"></i>
                                كلمة المرور
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       id="password"
                                       placeholder="أدخل كلمة المرور"
                                       required>
                                <button class="btn btn-outline-secondary" 
                                        type="button" 
                                        id="togglePassword">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember Me -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    تذكرني
                                </label>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold" id="loginBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            تسجيل الدخول
                        </button>

                    </form>

                    <!-- Footer -->
                   <div class="text-center mt-4">
    <p class="text-muted mb-2">ليس لديك حساب؟</p>
    <a href="register.html" class="btn btn-ksu-outline btn-sm">
        <i class="fas fa-user-plus me-1"></i>
        إنشاء حساب جديد
    </a>
</div>

<div class="text-center mt-3">
    <a href="../index.html" class="text-decoration-none text-muted small">
        <i class="fas fa-arrow-right me-1"></i>
        العودة إلى الصفحة الرئيسية
    </a>
</div>

                  

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>

   <script>
    document.addEventListener("DOMContentLoaded", () => {
        const user = getCurrentUser();
        if (user && user.role === "visitor") {
            // إخفاء زر التعديل عن الزوار
            document.querySelectorAll(".space-card").forEach(card => {
                card.onclick = null;
                card.style.cursor = "default";
            });
        }
    });
</script> 
</body>
</html>
