<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زياراتي - KSU Visitor Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .visit-card {
            background: #fff;
            border-radius: 15px;
            padding: 1.5rem;
            border-right: 5px solid;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s;
            margin-bottom: 1rem;
        }
        .visit-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        .stat-mini {
            background: #fff;
            border-radius: 15px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }
        .stat-mini:hover {
            transform: translateY(-3px);
        }
        .stat-mini .num {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
        }
        .stat-mini .lbl {
            color: #6c757d;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.3rem;
        }
        .qr-container {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            margin-top: 1rem;
        }
        .qr-container canvas, .qr-container img {
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a4d2e;">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-parking fa-2x text-warning me-2"></i>
                <span class="fw-bold">KSU Visitor Parking</span>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="visitor-visit.html" class="btn btn-warning btn-sm">
                    <i class="fas fa-plus me-1"></i> زيارة جديدة
                </a>
                <a href="visitor.html" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-parking me-1"></i> المواقف
                </a>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-1"></i> خروج
                </button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="py-5 text-white" style="background: linear-gradient(135deg, #1a4d2e 0%, #0d2818 100%);">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3" data-aos="fade-down">
                <i class="fas fa-calendar-check text-warning me-2"></i>
                زياراتي
            </h1>
            <p class="lead mb-0" data-aos="fade-up">تابع حالة زياراتك وتصاريحك</p>
        </div>
    </section>

    <!-- Stats -->
    <section class="container my-5">
        <div class="row g-4">
            <div class="col-6 col-md-3" data-aos="zoom-in">
                <div class="stat-mini">
                    <i class="fas fa-list fa-2x text-primary mb-2"></i>
                    <div class="num text-primary" id="visitTotal">0</div>
                    <div class="lbl">الإجمالي</div>
                </div>
            </div>
            <div class="col-6 col-md-3" data-aos="zoom-in" data-aos-delay="100">
                <div class="stat-mini">
                    <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                    <div class="num text-warning" id="visitPending">0</div>
                    <div class="lbl">قيد الانتظار</div>
                </div>
            </div>
            <div class="col-6 col-md-3" data-aos="zoom-in" data-aos-delay="200">
                <div class="stat-mini">
                    <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                    <div class="num text-success" id="visitApproved">0</div>
                    <div class="lbl">موافق عليها</div>
                </div>
            </div>
            <div class="col-6 col-md-3" data-aos="zoom-in" data-aos-delay="300">
                <div class="stat-mini">
                    <i class="fas fa-flag-checkered fa-2x text-info mb-2"></i>
                    <div class="num text-info" id="visitCompleted">0</div>
                    <div class="lbl">مكتملة</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Visits List -->
    <section class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">
                <i class="fas fa-list text-warning me-2"></i>
                قائمة الزيارات
            </h3>
            <button class="btn btn-ksu-outline btn-sm" onclick="loadMyVisits()">
                <i class="fas fa-sync-alt me-1"></i> تحديث
            </button>
        </div>
        <div id="visitsList">
            <div class="text-center py-5">
                <i class="fas fa-spinner fa-spin fa-3x text-warning"></i>
                <p class="mt-3 text-muted">جاري تحميل الزيارات...</p>
            </div>
        </div>
    </section>

    <!-- QR Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-qrcode text-warning me-2"></i>
                        تصريح الزيارة
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <h5 class="fw-bold mb-2" id="qrVisitCode">-</h5>
                    <p class="text-muted mb-3">أظهر هذا الرمز عند البوابة</p>

                    <div class="qr-container">
                        <div id="qrcode"></div>
                    </div>

                    <div class="mt-3">
                        <small class="text-muted d-block">رقم اللوحة</small>
                        <strong id="qrPlate">-</strong>
                    </div>

                    <div class="mt-2">
                        <small class="text-muted d-block">التاريخ والوقت</small>
                        <strong id="qrDateTime">-</strong>
                    </div>

                    <button class="btn btn-outline-secondary w-100 mt-3" onclick="printQR()">
                        <i class="fas fa-print me-1"></i> طباعة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/visit.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        document.addEventListener("DOMContentLoaded", () => {
            const token = requireAuth();
            if (!token) return;

            if (document.getElementById("visitsList")) {
                loadMyVisits();
            }
        });
    </script>
</body>
</html>
